name: DuoDemo
options:
  bundleIdPrefix: tech.cammi
  deploymentTarget:
    iOS: "17.0"
packages:
  HotwireNative:
    # 1.3 for HotwireTabBarController with tab ids and lazy loading.
    url: https://github.com/hotwired/hotwire-native-ios.git
    from: 1.3.0
  AppleHardwareBridgeComponent:
    path: ../..
  # The menu, share and toast controls. 0.14.0 only widens 0.13.2 (the
  # npm package) to Hotwire Native 1.3, which has HotwireTabBarController.
  BridgeComponents:
    url: https://github.com/joemasilotti/bridge-components
    exactVersion: 0.14.0
targets:
  DuoDemo:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: HotwireNative
        product: HotwireNative
      - package: AppleHardwareBridgeComponent
        product: AppleHardwareBridgeComponent
      - package: BridgeComponents
        product: BridgeComponents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.cammi.duo
        DEVELOPMENT_TEAM: DN536W3Y5B
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEMO_SITE_URL: "http://localhost:4321"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        Release:
          # The public demo site on GitHub Pages, served from the
          # gh-pages branch. Pass DEMO_SITE_URL=... to xcodebuild to
          # override it for one build.
          DEMO_SITE_URL: "https://cammi-technology.github.io/apple-hardware-bridge-component/"
    postBuildScripts:
      - name: Remove the localhost exception from Release builds
        basedOnDependencyAnalysis: false
        script: |
          # NSAllowsLocalNetworking lets the Debug app load http://localhost.
          # A TestFlight build only talks to an https URL, so drop it.
          if [ "$CONFIGURATION" = "Release" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" || true
          fi
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        CFBundleDisplayName: Duo Demo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        DemoSiteURL: $(DEMO_SITE_URL)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
